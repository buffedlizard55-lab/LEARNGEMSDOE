name: Public data fetch and footprint census

# Research-only. Fetches PUBLIC USGS ScienceBase / OpenEI GDR files (no DrivenData login,
# no secrets, no account) on a GitHub runner, because the Arena sandbox cannot complete TLS
# to those hosts. Competition rasters are NOT fetched: they sit behind the DrivenData login.
# Produces no prediction or submission file.

on:
  workflow_dispatch:
  push:
    branches: ["arena/**"]
    paths:
      - scripts/public_census.py
      - scripts/download_competition_data.sh
      - .github/workflows/public-data.yml

permissions:
  contents: read

jobs:
  census:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Download public files (script exits 2 when competition rasters are absent; expected)
        run: bash scripts/download_competition_data.sh || true
      - name: Install clip dependencies
        run: pip install pyshp shapely pyproj
      - name: Footprint census
        run: python3 scripts/public_census.py
      - name: Publish census as annotations (readable via api.github.com check-runs)
        if: always()
        run: |
          echo "::notice title=probe::$(grep -o '<title>[^<]*' data/raw/data-tab-probe.txt 2>/dev/null | tr -s ' \n' ' ' | head -c 200)"
          python3 - <<'PY'
          import json, pathlib
          p = pathlib.Path("data/raw/public_census.json")
          if not p.exists():
              print("::warning title=census::public_census.json not written"); raise SystemExit
          r = json.loads(p.read_text())
          for k, v in r["layers"].items():
              if k != "qfaults":
                  print(f"::notice title=layer {k}::records={v['records']} crs={v['crs']} attrs={json.dumps(v.get('attributes'))}")
          for k, v in r["clip"].items():
              print(f"::notice title=clip {k}::{json.dumps(v)}")
          print("::notice title=files::" + " ; ".join(f"{v['name']} bytes={v['bytes']} sha256={v['sha256']}" for v in r["files"].values()))
          print(f"::notice title=total::qfaults_total_records={r['qfaults_total_records']}")
          o = r.get("offsets") or {}
          print("::notice title=offsets::" + json.dumps(dict((k, v) for k, v in o.items() if k != "usgs_layers")))
          for name, layer in (o.get("usgs_layers") or {}).items():
              print(f"::notice title=usgs layer {name}::" + json.dumps(layer)[:900])
          PY
      - name: INGENIOUS v2 field definitions (MAPSCALE semantics)
        if: always()
        run: |
          d=data/raw/_unzipped/qfaults_v2
          echo "::notice title=v2 members::$(cd $d && find . -type f | sort | tr '\n' ' ' | head -c 900)"
          for f in $(find $d -type f \( -iname '*.txt' -o -iname '*.xml' -o -iname '*.pdf' -o -iname '*.doc*' -o -iname '*.csv' \)); do
            case "$f" in *.pdf) (sudo apt-get install -y -qq poppler-utils >/dev/null 2>&1; pdftotext "$f" "$f.txt") && f="$f.txt";; esac
            hits=$(grep -i -n -A3 'MAPSCALE\|map scale' "$f" 2>/dev/null | tr -s ' \t\r\n' ' ' | head -c 1500)
            [ -n "$hits" ] && echo "::notice title=MAPSCALE in $(basename $f)::$hits"
          done
          r=$(find $d -iname 'README_fielddefinitions*.txt' | head -1)
          if [ -n "$r" ]; then
            echo "::notice title=README lines 45-70::$(sed -n '45,70p' "$r" | tr -d '\r' | sed 's/$/ ||/' | tr '\n' ' ')"
            echo "::notice title=README lines 86-120::$(sed -n '86,120p' "$r" | tr -d '\r' | sed 's/$/ ||/' | tr '\n' ' ')"
            echo "::notice title=README wc::$(wc -l < "$r") lines, sha256 $(sha256sum "$r" | cut -c1-64)"
          fi
          true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-census
          path: |
            data/raw/public_census.json
            data/raw/data-tab-probe.txt
          if-no-files-found: warn
